name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  guardas:
    name: Guardas de registro de componente
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Os componentes montam o shadow DOM com template literal, e os
      # comentários dentro do <style> citam nomes de propriedade CSS. Um backtick
      # em volta de um desses nomes encerra a string e o arquivo vira
      # SyntaxError. Já aconteceu duas vezes (`gap` no Dropdown.js, `pt-4` no
      # Modal.js), e o sintoma na página é "as tags <me-*> viraram texto cru" —
      # que o AGENTS.md ensina a diagnosticar como 404, cópia duplicada ou tag
      # self-closing. O sintoma aponta três causas erradas antes da certa.
      - name: Componentes sem erro de sintaxe
        run: node tools/check-syntax.mjs

      # customElements.define cru lança NotSupportedError quando a tag já
      # existe, e por estar no topo do módulo a exceção aborta a avaliação e
      # derruba os imports seguintes: duas cópias do kit na mesma página
      # deixavam 14 das 23 tags registradas. Ver components/define.js.
      - name: define() em vez de customElements.define cru
        run: |
          encontrados=$(grep -rn 'customElements\.define' components/ \
            | grep -v 'components/define.js' || true)
          if [ -n "$encontrados" ]; then
            echo "::error::Registre componentes com define() de ./define.js, não com customElements.define:"
            echo "$encontrados"
            exit 1
          fi
          echo "OK — nenhuma chamada crua fora do define.js"

      - name: Todo arquivo que chama define() importa o helper
        run: |
          falhas=0
          for arquivo in $(grep -rl "^define('me-" components/*.js); do
            if ! grep -q "from './define.js'" "$arquivo"; then
              echo "::error file=$arquivo::chama define() sem importar de './define.js'"
              falhas=1
            fi
          done
          if [ "$falhas" -ne 0 ]; then exit 1; fi
          echo "OK — todos os arquivos que registram tag importam define()"

      # Componentes devem ler aliases semânticos (--me-color-brand*), nunca a
      # escala crua: --me-color-brand é ALIAS de --me-color-primary-30, então
      # quem lê a escala direto ignora o override de tema do consumidor. Era o
      # que deixava o botão primário teal enquanto o resto virava rosa.
      #
      # ESCOPO: só a família primary (a da marca), já normalizada. As escalas
      # secondary/tertiary têm 8 usos crus que ainda esperam aliases novos
      # (--me-color-text-strong p/ secondary-40, --me-color-accent p/ o rosa
      # tertiary-30 do toggle da sidebar). Ao criá-los, inclua-as no regex:
      #   Button.js:107  Filters.js:77,160  PageHeader.js:125,129
      #   RadioGroup.js:91  Sidebar.js:78,353,357  Tabs.js:73
      # (o rosa do PageHeader.js é o mesmo ícone do toggle do Sidebar.js: quando
      #  --me-color-accent existir, os quatro usos de tertiary-30 migram juntos.)
      #
      # As famílias neutral/gray também são lidas cruas (bordas e fundos de
      # controle) e não têm alias suficiente: --me-color-border tem um único
      # consumidor enquanto o kit usa sete cores de borda distintas.
      - name: Componentes não leem a escala de cor da marca crua
        run: |
          encontrados=$(grep -nE 'var\(--me-color-primary-[0-9]+' components/*.js || true)
          if [ -n "$encontrados" ]; then
            echo "::error::Use um alias semântico (--me-color-brand / -light / -dark / -soft) em vez da escala primary crua:"
            echo "$encontrados"
            exit 1
          fi
          echo "OK — nenhum componente lê a escala primary crua"

      - name: Todo componente entra no agregador
        run: |
          falhas=0
          for arquivo in $(grep -rl "^define('me-" components/*.js); do
            nome=$(basename "$arquivo")
            # Sidebar.js importa Logo.js e Icon.js; ambos já estão no index.js.
            if ! grep -q "import './$nome'" components/index.js; then
              echo "::error file=components/index.js::falta 'import ./$nome' no agregador"
              falhas=1
            fi
          done
          if [ "$falhas" -ne 0 ]; then exit 1; fi
          echo "OK — todos os componentes estão em components/index.js"

  versao:
    name: Guarda de versão publicada
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # A versão do kit aparece em 12 lugares de 3 arquivos (URLs do jsDelivr
      # nos snippets, a prosa que explica a tag, e o fallback do badge). Nada
      # garantia que andassem juntos, e o modo de falha é silencioso: um
      # protótipo copiado do README aponta para uma tag que não existe. Já
      # aconteceu duas vezes — 2dea1c7 e 95bd272 são hotfixes dessas strings.
      #
      # As DUAS asserções abaixo rodam em momentos diferentes de propósito. Um
      # push para main pode legitimamente ter os docs já bumpados para uma tag
      # que ainda não foi criada; se a guarda comparasse com a última tag em
      # todo push, quebraria nesse caso normal e seria treinada a ser ignorada.
      - name: Docs concordam entre si sobre a versão
        run: node tools/release.mjs --check

      # Só no release: os docs têm de bater com a tag sendo publicada. Pega o
      # caso de tagear sem rodar o script de bump.
      - name: Versão dos docs == tag publicada
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          # Via env, não interpolado no shell: nome de tag é entrada externa.
          TAG: ${{ github.ref_name }}
        run: node tools/release.mjs --check --expect "$TAG"

# NOTA: test/collision.html verifica o comportamento em runtime (23 tags
# registradas, nenhuma exceção, 1 aviso agregado) e precisa de navegador —
# roda à mão com `npx serve .`. Automatizar exige Playwright; quando houver
# build/npm no projeto, vale trazer para cá.
