<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>PRD 32 — rótulo da subseção de demos</title>

  <!-- Este arquivo não é uma demo: é o rótulo da pasta na vitrine de #/demos.
       A vitrine agrupa demo/<pasta>/*.html numa subseção e, se existir um
       _secao.html ali, tira o título e a descrição dela DESTES metas. Sem o
       arquivo a subseção usaria o nome da pasta ("prd32"), que é o nome de
       diretório, não um rótulo de tela.
       Arquivo começando com _ nunca vira card — é assim que ele fica de fora
       da própria lista que rotula. -->
  <meta name="demo-title" content="PRD 32 · Auditoria de folha" />
  <meta name="demo-description" content="protótipos das telas do PRD 32, em revisão" />
</head>
<body>
  <p>
    Rótulo da subseção <strong>PRD 32</strong> na vitrine de demos.
    Não há tela aqui — veja os arquivos ao lado nesta pasta.
  </p>
</body>
</html>
